{% extends '_base.html' %}
{% block content %}
    <h1>Change Password</h1>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Change Password">
        </form>
    {% else %}
        <p>Invalid password reset link!</p>
    {% endif %}
{% endblock content %}
